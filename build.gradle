plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
}

sourceSets {
    tools {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + sourceSets.main.runtimeClasspath
    }
    test {
        compileClasspath += sourceSets.tools.output
        runtimeClasspath += sourceSets.tools.output
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "rootboot" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
        "rootboot-gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            inherit server
            name "Game Test"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.file('gametest-results.xml').get().asFile}"
            runDir "build/gametest"
        }
    }
}

// The client features are unit tested from src/test, so the test source set needs the client
// source set that splitEnvironmentSourceSets creates above.
sourceSets.test {
    compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
    runtimeClasspath += sourceSets.client.output + sourceSets.client.runtimeClasspath
}

fabricApi {
    configureDataGeneration {
        // Generated JSON is committed here and packaged into the JAR; it is never edited by hand
        // (ADR-0003). The datagen entrypoint lives in the main source set alongside the providers.
        outputDirectory = file("src/main/generated")
        createSourceSet = false
        strictValidation = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.1+ ships unobfuscated, so the no-remap fabric-loom plugin needs neither a
    // mappings layer nor the mod* (remap) configurations: dependencies are plain implementation.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    api "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    gametestImplementation sourceSets.main.output
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

test {
    useJUnitPlatform()
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

tasks.register("scanSpawners", JavaExec) {
    group = "application"
    description = "Scans a closed Minecraft world for simultaneously activatable spawners."
    classpath = sourceSets.tools.runtimeClasspath
    mainClass = "br.com.bobwizley.rootboot.tools.spawners.SpawnerScannerCli"
    jvmArgs "--sun-misc-unsafe-memory-access=allow"
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}
